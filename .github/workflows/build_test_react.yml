name: NodeJS CI

on: [push]

jobs:
 build:
   runs-on: windows-latest
   strategy:
     matrix:
       node-version: [18.x]

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Use Node.js ${{ matrix.node-version }}
       uses: actions/setup-node@v2
       with:
         node-version: ${{ matrix.node-version }}
     - name: Unit checks
       run: |
         npm ci
         npm test
     - name: E2E checks
       run: |
         npm start &
         sleep 10
        
         npm run wdio --spec C:\Users\PadraicD\Desktop\MOTApp\mot-cert-support-app-js\test\specs\test.e2e.js
     - name: Build production artifacts
       run: |
         npm run build --if-present

